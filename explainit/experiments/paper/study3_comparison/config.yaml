# Badania III - comparison against the standard counterfactual methods.
#
# All methods solve the identical instance: same sample, same target, same
# feasible region (derived from the priority set), same epsilon, same number of
# requested counterfactuals. The priority score is computed post hoc for every
# method, including those that do not optimise it - that is the point of the
# comparison.
#
# This revision adds the three fairness items identified in the first pass:
#
#   free_budget      - every method at its own natural budget (the original
#                      comparison; keeps the earlier result reproducible);
#   budget_2000      - every method capped at 2 000 model evaluations per
#                      instance, so quality is compared at equal cost; a method
#                      that cannot finish inside the cap is recorded as
#                      `budget_exceeded` rather than silently spending more;
#   *_cat arms       - the baselines are allowed to move categorical one-hot
#                      columns and their output is repaired to a valid one-hot
#                      state, removing the "only the priority methods may
#                      switch categories" asymmetry;
#   hard_target      - the same comparison at a 2x harder target (2 prediction
#                      standard deviations instead of 1), since every earlier
#                      conclusion was conditional on one difficulty.
#
# Gradient methods are now charged for the calls they make straight to the
# network, so their `model_rows` is comparable with the model-agnostic methods.
#
# MINLP uses the Badania I defaults (shap 100, patience 3, one Stage 7 sweep).

study: study3_comparison

defaults:
  epsilon: 0.05
  n_cfs: 1
  seeds: [0, 1, 2]
  dataset: [auto_mpg, carseats, bike_sharing_hourly]
  priority_set: [medium]
  selection:
    strategy: random
    n_samples: 10
    seed: 7
    target_offset_pred_std: -1.0
    skip_if_target_below: 0.0

_minlp: &minlp
  shap_approx: true
  shap_num_samples: 100
  max_iterations: 10
  patience: 3
  target_exemplar_epsilon: 0.10
  peak_lock_in: true
  peak_lock_in_max_sweeps: 1
  trust_region: false
  residual_correction: false
  restoration: false

arms:
  # ---- free budget: each method at its natural cost -----------------------
  - {name: minlp, method: minlp, params: *minlp}
  - {name: random_search, method: random_search,
     params: {max_iterations: 10000, use_monte_carlo: true}}
  - {name: dice, method: dice,
     params: {total_cfs: 5, method: genetic, backend: sklearn}}
  - {name: wachter, method: wachter,
     params: {learning_rate: 0.1, max_iterations: 1000, proximity_weight: 0.005}}
  - {name: sparse_wachter, method: sparse_wachter,
     params: {learning_rate: 0.1, max_iterations: 1000, proximity_weight: 0.005}}
  - {name: prototype, method: prototype,
     params: {learning_rate: 0.1, max_iterations: 1000}}
  - {name: growing_spheres, method: growing_spheres,
     params: {n_samples_per_shell: 200, max_shells: 50}}
  - {name: nelder_mead, method: nelder_mead, params: {max_iterations: 1000}}
  - {name: bayesian_optimization, method: bayesian_optimization,
     params: {n_iterations: 100}}

  # ---- budget-matched: 2 000 model evaluations per instance ---------------
  - {name: minlp_budget2k, method: minlp,
     params: {<<: *minlp, max_model_rows: 2000}}
  - {name: random_search_budget2k, method: random_search,
     params: {max_iterations: 10000, use_monte_carlo: true, max_model_rows: 2000}}
  - {name: dice_budget2k, method: dice,
     params: {total_cfs: 5, method: genetic, backend: sklearn, max_model_rows: 2000}}
  - {name: growing_spheres_budget2k, method: growing_spheres,
     params: {n_samples_per_shell: 200, max_shells: 50, max_model_rows: 2000}}
  - {name: bayesian_optimization_budget2k, method: bayesian_optimization,
     params: {n_iterations: 100, max_model_rows: 2000}}
  - {name: wachter_budget2k, method: wachter,
     params: {learning_rate: 0.1, max_iterations: 1000, proximity_weight: 0.005,
              max_model_rows: 2000}}

  # ---- categorical release: baselines may switch categories ---------------
  - {name: dice_cat, method: dice,
     params: {total_cfs: 5, method: genetic, backend: sklearn, allow_categorical: true}}
  - {name: growing_spheres_cat, method: growing_spheres,
     params: {n_samples_per_shell: 200, max_shells: 50, allow_categorical: true}}
  - {name: wachter_cat, method: wachter,
     params: {learning_rate: 0.1, max_iterations: 1000, proximity_weight: 0.005,
              allow_categorical: true}}

  # ---- harder target: 2 prediction standard deviations --------------------
  # All four arms share a 50 000-evaluation cap. Without it DiCE's genetic
  # search never terminates on instances where the 2-sigma target is out of
  # reach (observed: one instance ran for ~2 h at 95 % CPU). With the cap such
  # an instance is recorded as a budget failure, which is the honest result,
  # and the harder-target comparison is budget-matched by construction.
  - name: minlp_hard_target
    method: minlp
    params: {<<: *minlp, max_model_rows: 50000}
    selection: {strategy: random, n_samples: 10, seed: 7,
                target_offset_pred_std: -2.0, skip_if_target_below: 0.0}
  - name: random_search_hard_target
    method: random_search
    params: {max_iterations: 10000, use_monte_carlo: true, max_model_rows: 50000}
    selection: {strategy: random, n_samples: 10, seed: 7,
                target_offset_pred_std: -2.0, skip_if_target_below: 0.0}
  - name: dice_hard_target
    method: dice
    params: {total_cfs: 5, method: genetic, backend: sklearn, max_model_rows: 50000}
    selection: {strategy: random, n_samples: 10, seed: 7,
                target_offset_pred_std: -2.0, skip_if_target_below: 0.0}
  - name: growing_spheres_hard_target
    method: growing_spheres
    params: {n_samples_per_shell: 200, max_shells: 50, max_model_rows: 50000}
    selection: {strategy: random, n_samples: 10, seed: 7,
                target_offset_pred_std: -2.0, skip_if_target_below: 0.0}
