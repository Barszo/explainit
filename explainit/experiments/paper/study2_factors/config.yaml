# Badania II - what affects the method, measured with paired statistics.
#
# One arm per factor level. Every arm runs the identical method configuration
# on a dataset *variant* that differs from the baseline in exactly one
# property, so the delta is attributable to that property. Variants are built
# by `factor_datasets.py` (same preprocessing, same model architecture, one
# changed data property, retrained model).
#
# Factors and their levels:
#   train_size      1.0 (baseline) / 0.5 / 0.25 / 0.10  - learning-set size
#   n_features      all (baseline) / top 75% / top 50%  - dataset width
#   feature_noise   0 (baseline) / 0.10 / 0.25 / 0.50   - input noise (scaled)
#   label_noise     0 (baseline) / 0.05 / 0.10 / 0.20   - target noise
#   target_skew     none (baseline) / low_heavy / high_heavy - imbalance
#   numerical_only  categorical groups dropped          - feature type
#
# Analysis: pair each variant cell against its baseline cell on
# (sample_id, seed) and report Wilcoxon / sign test / Cliff's delta with Holm
# correction, plus the budget (`model_rows`) and validity columns -- a factor
# can hurt the method either by lowering the priority achieved or by making it
# fail to return a counterfactual at all.
#
# `random_search` runs alongside on every variant so factor effects can be
# separated from "this variant is simply harder for any method".

study: study2_factors

defaults:
  epsilon: 0.05
  n_cfs: 1
  seeds: [0, 1, 2]
  priority_set: [medium]
  selection:
    strategy: random
    n_samples: 10
    seed: 7
    target_offset_pred_std: -1.0
    skip_if_target_below: 0.0

_minlp_params: &minlp_params
  # Defaults chosen in Badania I: quality is flat above these values, so this
  # is ~4x cheaper than the original 200/5/3 configuration at equal quality.
  shap_approx: true
  shap_num_samples: 100
  max_iterations: 10
  patience: 3
  target_exemplar_epsilon: 0.10
  peak_lock_in: true
  peak_lock_in_max_sweeps: 1
  trust_region: false
  residual_correction: false
  restoration: false

_rs_params: &rs_params
  max_iterations: 10000
  use_monte_carlo: true

arms:
  # ---- baseline (factor level 0 for every factor) ------------------------
  - name: baseline
    method: minlp
    dataset: [auto_mpg, carseats, bike_sharing_hourly]
    params: *minlp_params
  - name: baseline_rs
    method: random_search
    dataset: [auto_mpg, carseats, bike_sharing_hourly]
    params: *rs_params

  # ---- factor: training-set size -----------------------------------------
  - name: train_size
    method: minlp
    dataset: [auto_mpg__train_size_0p5, auto_mpg__train_size_0p25, auto_mpg__train_size_0p1,
              carseats__train_size_0p5, carseats__train_size_0p25, carseats__train_size_0p1]
    params: *minlp_params
  - name: train_size_rs
    method: random_search
    dataset: [auto_mpg__train_size_0p5, auto_mpg__train_size_0p25, auto_mpg__train_size_0p1,
              carseats__train_size_0p5, carseats__train_size_0p25, carseats__train_size_0p1]
    params: *rs_params

  # ---- factor: number of features ----------------------------------------
  - name: n_features
    method: minlp
    dataset: [auto_mpg__n_features_0p75, auto_mpg__n_features_0p5,
              carseats__n_features_0p75, carseats__n_features_0p5]
    params: *minlp_params
  - name: n_features_rs
    method: random_search
    dataset: [auto_mpg__n_features_0p75, auto_mpg__n_features_0p5,
              carseats__n_features_0p75, carseats__n_features_0p5]
    params: *rs_params

  # ---- factor: feature noise ---------------------------------------------
  - name: feature_noise
    method: minlp
    dataset: [auto_mpg__feature_noise_0p1, auto_mpg__feature_noise_0p25, auto_mpg__feature_noise_0p5,
              carseats__feature_noise_0p1, carseats__feature_noise_0p25, carseats__feature_noise_0p5]
    params: *minlp_params
  - name: feature_noise_rs
    method: random_search
    dataset: [auto_mpg__feature_noise_0p1, auto_mpg__feature_noise_0p25, auto_mpg__feature_noise_0p5,
              carseats__feature_noise_0p1, carseats__feature_noise_0p25, carseats__feature_noise_0p5]
    params: *rs_params

  # ---- factor: label noise ------------------------------------------------
  - name: label_noise
    method: minlp
    dataset: [auto_mpg__label_noise_0p05, auto_mpg__label_noise_0p1, auto_mpg__label_noise_0p2,
              carseats__label_noise_0p05, carseats__label_noise_0p1, carseats__label_noise_0p2]
    params: *minlp_params
  - name: label_noise_rs
    method: random_search
    dataset: [auto_mpg__label_noise_0p05, auto_mpg__label_noise_0p1, auto_mpg__label_noise_0p2,
              carseats__label_noise_0p05, carseats__label_noise_0p1, carseats__label_noise_0p2]
    params: *rs_params

  # ---- factor: target distribution skew (imbalance) -----------------------
  - name: target_skew
    method: minlp
    dataset: [auto_mpg__target_skew_low_heavy, auto_mpg__target_skew_high_heavy,
              carseats__target_skew_low_heavy, carseats__target_skew_high_heavy]
    params: *minlp_params
  - name: target_skew_rs
    method: random_search
    dataset: [auto_mpg__target_skew_low_heavy, auto_mpg__target_skew_high_heavy,
              carseats__target_skew_low_heavy, carseats__target_skew_high_heavy]
    params: *rs_params

  # ---- factor: feature type (categorical groups removed) ------------------
  - name: numerical_only
    method: minlp
    dataset: [auto_mpg__numerical_only_True, carseats__numerical_only_True]
    params: *minlp_params
  - name: numerical_only_rs
    method: random_search
    dataset: [auto_mpg__numerical_only_True, carseats__numerical_only_True]
    params: *rs_params

  # ---- factor: priority strictness (no new data needed) -------------------
  - name: strictness
    method: minlp
    dataset: [auto_mpg, carseats, bike_sharing_hourly]
    priority_set: [loose, strict]
    params: *minlp_params
  - name: strictness_rs
    method: random_search
    dataset: [auto_mpg, carseats, bike_sharing_hourly]
    priority_set: [loose, strict]
    params: *rs_params

  # ---- replication: the three significant factors, second construction seed
  # Confirms that a factor effect is not an artefact of one noise/subsample
  # draw. Variant keys ending in `_s1` were built with construction seed 1.
  - name: replicate_seed1
    method: minlp
    dataset: [auto_mpg__numerical_only_True_s1, auto_mpg__n_features_0p5_s1,
              auto_mpg__label_noise_0p2_s1,
              carseats__numerical_only_True_s1, carseats__n_features_0p5_s1,
              carseats__label_noise_0p2_s1]
    params: *minlp_params
  - name: replicate_seed1_rs
    method: random_search
    dataset: [auto_mpg__numerical_only_True_s1, auto_mpg__n_features_0p5_s1,
              auto_mpg__label_noise_0p2_s1,
              carseats__numerical_only_True_s1, carseats__n_features_0p5_s1,
              carseats__label_noise_0p2_s1]
    params: *rs_params
