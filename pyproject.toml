[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explainit"
dynamic = ["version"]
description = "Preference-aware counterfactual explanations for machine learning models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bartosz Szostak" }]
requires-python = ">=3.12"
keywords = [
    "counterfactual explanations",
    "explainable AI",
    "XAI",
    "machine learning",
    "interpretability",
    "recourse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/Barszo/explainit_project"
Repository = "https://github.com/Barszo/explainit_project"
Issues = "https://github.com/Barszo/explainit_project/issues"
Changelog = "https://github.com/Barszo/explainit_project/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "pytest>=8",
    "pytest-cov>=5",
]
lint = [
    "pre-commit>=4",
    "ruff>=0.17",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[tool.setuptools.dynamic]
version = { attr = "explainit.__version__" }

[tool.setuptools.packages.find]
include = ["explainit", "explainit.*"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
log_level = "INFO"

[tool.ruff]
line-length = 100
extend-exclude = ["trash", "dev"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "NPY",     # NumPy-specific rules
    "RUF",     # Ruff-specific rules
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "PGH",     # pygrep-hooks
    "PT",      # flake8-pytest-style
    "T20",     # flake8-print
]
ignore = [
    "E501",    # long lines are handled by the formatter where possible
]

[tool.ruff.lint.per-file-ignores]
# Legacy global NumPy RNG; scheduled for migration to numpy.random.Generator.
"explainit/explainers/*.py" = ["NPY002"]
"explainit/utils/priority_plots.py" = ["NPY002"]

[tool.ruff.lint.isort]
known-first-party = ["explainit"]

[tool.coverage.run]
source = ["explainit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
