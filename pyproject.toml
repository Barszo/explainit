[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "explainit"
dynamic = ["version"]
description = "Preference-aware counterfactual explanations for machine learning models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bartosz Szostak" }]
requires-python = ">=3.12"
keywords = [
    "counterfactual explanations",
    "explainable AI",
    "XAI",
    "machine learning",
    "interpretability",
    "recourse",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
pandas = ["pandas>=2.2.2"]

[project.urls]
Homepage = "https://github.com/Barszo/explainit_project"
Repository = "https://github.com/Barszo/explainit_project"
Issues = "https://github.com/Barszo/explainit_project/issues"
Changelog = "https://github.com/Barszo/explainit_project/blob/main/CHANGELOG.md"

[dependency-groups]
test = [
    "hypothesis>=6.100",
    "pandas>=2.2.2",
    "pytest>=8",
    "pytest-cov>=5",
]
benchmark = [
    "scikit-learn>=1.5",
]
lint = [
    "pre-commit>=4",
    "ruff>=0.17",
]
typecheck = [
    "mypy>=2.4",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.16",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
    { include-group = "typecheck" },
]

[tool.setuptools.dynamic]
version = { attr = "explainit.__version__" }

[tool.setuptools.packages.find]
include = ["explainit", "explainit.*"]

[tool.setuptools.package-data]
explainit = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "snapshot: compares results with recorded outputs of a fixed dependency set",
]
filterwarnings = [
    "error",
    # Old Matplotlib releases call pyparsing APIs that newer pyparsing deprecates.
    "ignore:'\\w+' deprecated - use '\\w+':DeprecationWarning",
    # Snapshot CI job pins NumPy's CPU features; unknown names only warn.
    "ignore:.*CPU features:ImportWarning",
]
log_level = "INFO"

[tool.ruff]
line-length = 100
extend-exclude = ["trash", "dev"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # Pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "NPY",     # NumPy-specific rules
    "RUF",     # Ruff-specific rules
    "SIM",     # flake8-simplify
    "C4",      # flake8-comprehensions
    "PIE",     # flake8-pie
    "PGH",     # pygrep-hooks
    "PT",      # flake8-pytest-style
    "T20",     # flake8-print
]
ignore = [
    "E501",    # long lines are handled by the formatter where possible
]
# Mathematical notation used intentionally in docstrings.
allowed-confusables = ["×"]

[tool.ruff.lint.per-file-ignores]
# Tests inspect the legacy global NumPy random state on purpose.
"tests/*" = ["NPY002"]
# Command-line scripts report results on stdout.
"benchmarks/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["explainit"]
combine-as-imports = true

[tool.mypy]
python_version = "3.12"
files = ["explainit", "tests", "benchmarks"]
# Everything is type-checked; tests and scripts need not be annotated.
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
extra_checks = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# The library itself is fully annotated (the rules of mypy --strict).
module = ["explainit", "explainit.*"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_reexport = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["hypothesis.*"]
follow_untyped_imports = true

[[tool.mypy.overrides]]
module = ["sklearn.*"]  # no type information published
ignore_missing_imports = true

[tool.coverage.run]
source = ["explainit"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
